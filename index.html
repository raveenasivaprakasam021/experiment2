<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchPad Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <main class="auth-layout">
            <section class="brand-panel">
                <div class="brand-badge">New Member Access</div>
                <h1>Build your next big idea.</h1>
                <p>
                    Join a creative network designed for founders, makers, and ambitious teams ready to launch faster.
                </p>

                <ul class="feature-list">
                    <li>Private community access</li>
                    <li>Early product updates</li>
                    <li>Curated startup opportunities</li>
                </ul>
            </section>

            <section class="form-panel">
                <div class="form-header">
                    <p>Start for free</p>
                    <h2>Create account</h2>
                </div>

                <form id="myForm" novalidate>
                    <div class="field-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                        <span id="nameError" class="error"></span>
                    </div>

                    <div class="field-group">
                        <label for="email">Email address</label>
                        <input type="text" id="email" placeholder="you@example.com">
                        <span id="emailError" class="error"></span>
                    </div>

                    <div class="field-group">
                        <label for="phone">Phone number</label>
                        <input type="text" id="phone" placeholder="10-digit mobile number">
                        <span id="phoneError" class="error"></span>
                    </div>

                    <div class="field-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a strong password">
                        <div class="password-meter" aria-hidden="true">
                            <span id="strengthBar"></span>
                        </div>
                        <span id="passwordError" class="error"></span>
                    </div>

                    <div class="field-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" placeholder="Repeat your password">
                        <span id="confirmError" class="error"></span>
                    </div>

                    <div class="field-group inline-group">
                        <label>Gender</label>
                        <div class="radio-row">
                            <label class="choice"><input type="radio" name="gender" value="Male"> Male</label>
                            <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>
                        </div>
                        <span id="genderError" class="error"></span>
                    </div>

                    <div class="field-group">
                        <label for="city">City</label>
                        <select id="city">
                            <option value="">Select your city</option>
                            <option>Chennai</option>
                            <option>Coimbatore</option>
                            <option>Bangalore</option>
                            <option>Hyderabad</option>
                        </select>
                        <span id="cityError" class="error"></span>
                    </div>

                    <label class="terms-row">
                        <input type="checkbox" id="terms">
                        <span>I agree to the Terms & Conditions</span>
                    </label>
                    <span id="termsError" class="error"></span>

                    <button type="submit">Register now</button>
                </form>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
